<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TingXie Buddy</title>
<style>
:root{--bg:#FFF9EF;--ink:#1B2A4A;--sky:#B9DFF5;--sun:#FFE49A;--coral:#F6A28D;--mint:#BCE5C9;--lav:#D8C9F0;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#FFF9EF;--ink:#1B2A4A}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Nunito","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
.zh{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0}h2{font-size:22px;margin:6px 0}
button,input,select{font:inherit;color:inherit}
.btn{min-height:52px;padding:10px 20px;border:3px solid var(--ink);border-radius:18px;background:var(--sun);font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--sky)}.btn.go{background:var(--mint)}.btn.soft{background:#fff}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.map{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dest{border:3px solid var(--ink);border-radius:26px;padding:14px;text-align:left;cursor:pointer;min-height:130px;font-weight:700;box-shadow:0 5px 0 var(--ink)}
.dest big{display:block;font-size:44px}.dest small{display:block;font-weight:600;opacity:.85}
.big{font-size:96px;line-height:1.1;text-align:center;margin:0}
.emo{font-size:84px;text-align:center}
.py{font-size:26px;text-align:center;font-weight:800}
.bar{height:16px;background:#fff;border:3px solid var(--ink);border-radius:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--coral)}
input.t{width:100%;font-size:40px;text-align:center;padding:10px;border:3px solid var(--ink);border-radius:18px;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.tiles button{font-size:36px;min-height:70px;border:3px solid var(--ink);border-radius:18px;background:var(--lav);cursor:pointer}
.msg{padding:12px;border-radius:18px;font-weight:800;text-align:center;margin:10px 0}
.ok{background:var(--mint)}.try{background:var(--sun)}
.tag{display:inline-block;padding:2px 10px;border:2px solid var(--ink);border-radius:20px;font-size:13px;background:var(--sun);font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
canvas{width:100%;max-width:340px;aspect-ratio:1;display:block;margin:8px auto;border:3px solid var(--ink);border-radius:18px;background:#fff;touch-action:none}
.bd{font-size:34px;text-align:center;padding:10px;border:3px solid var(--ink);border-radius:18px;background:#fff}.bd.off{filter:grayscale(1);opacity:.35}
.pop{animation:pop .4s}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}*{transition:none!important}}
</style></head><body><main id="app"></main>
<script>
var W=[["水","shuǐ","water","air","💧","我喝水。","I drink water."],["火","huǒ","fire","api","🔥","火很热。","Fire is hot."],["山","shān","mountain","gunung","⛰️","山很高。","The mountain is tall."],["日","rì","sun / day","matahari / hari","☀️","日出很美。","The sunrise is beautiful."],["月","yuè","moon","bulan","🌙","月亮很圆。","The moon is round."],["木","mù","tree / wood","pokok / kayu","🌳","木头很重。","The wood is heavy."],["鱼","yú","fish","ikan","🐟","鱼在水里。","The fish is in the water."],["鸟","niǎo","bird","burung","🐦","鸟在飞。","The bird is flying."],["花","huā","flower","bunga","🌸","花很红。","The flower is red."],["手","shǒu","hand","tangan","✋","我有两只手。","I have two hands."],["大","dà","big","besar","🐘","大象很大。","The elephant is big."],["小","xiǎo","small","kecil","🐜","蚂蚁很小。","The ant is small."]].map(function(a){return{c:a[0],p:a[1],en:a[2],bm:a[3],e:a[4],s:a[5],st:a[6]}});
var T={en:{hello:"Hello, Little Mandarin Explorer!",sub:"Let’s discover Chinese words together!",start:"Start Learning",cont:"Continue My Adventure",parent:"Parent Login",name:"What is your name?",yr:"Which school year?",know:"Have you learned Mandarin before?",k1:"I’m just starting",k2:"I know a little",k3:"I want more practice",go:"Let’s go!",back:"← Map",wf:"Word Forest",lb:"Listening Beach",cc:"Character Castle",mg:"Memory Garden",ai:"Achievement Island",wfd:"Meet new words",lbd:"Listen and write",ccd:"Trace characters",mgd:"Words to revisit",aid:"Stars and badges",listen:"🔊 Listen",slow:"🐢 Slow",next:"Next →",reveal:"Show me!",what:"What do you see?",ok:["You did it!","Wah, hebat!","Another word mastered!"],almost:"Almost there! Let’s listen again.",answer:"The answer is",check:"Check",type:"Type the character you hear",or:"Or tap it:",modes:["Guided","Practice","Test"],n:"Questions",begin:"Begin",fin:"All done!",revise:"Words to practise",none:"Nothing here yet. Learn some words first!",clear:"Clear",trace:"Trace the grey character. This is practice only; it is not marked.",fav:"☆ Hard word",demo:"DEMO MODE · sample vocabulary, not verified KPM content · progress saved on this device only",lang:"Bahasa Melayu",pt:"Practise Together",ptx:"Play the word. Ask your child to repeat it twice, then hide the translation and ask what it means.",today:"Today’s idea",mastered:"Mastered",pr:"Practice words"},
ms:{hello:"Helo, Penjelajah Mandarin Kecil!",sub:"Jom kenali perkataan Cina bersama!",start:"Mula Belajar",cont:"Sambung Pengembaraan",parent:"Log Masuk Ibu Bapa",name:"Siapa nama kamu?",yr:"Darjah berapa?",know:"Pernah belajar Mandarin?",k1:"Baru mula",k2:"Tahu sedikit",k3:"Mahu lebih latihan",go:"Jom!",back:"← Peta",wf:"Hutan Perkataan",lb:"Pantai Dengar",cc:"Istana Aksara",mg:"Taman Ulang Kaji",ai:"Pulau Pencapaian",wfd:"Kenali perkataan baru",lbd:"Dengar dan tulis",ccd:"Jejak aksara",mgd:"Perkataan perlu diulang",aid:"Bintang dan lencana",listen:"🔊 Dengar",slow:"🐢 Perlahan",next:"Seterusnya →",reveal:"Tunjuk!",what:"Apa yang kamu nampak?",ok:["Berjaya!","Wah, hebat!","Satu lagi perkataan dikuasai!"],almost:"Hampir! Jom dengar lagi.",answer:"Jawapannya",check:"Semak",type:"Taip aksara yang didengar",or:"Atau ketik:",modes:["Berpandu","Latihan","Ujian"],n:"Soalan",begin:"Mula",fin:"Siap!",revise:"Perkataan untuk dilatih",none:"Belum ada. Belajar dahulu!",clear:"Padam",trace:"Jejak aksara kelabu. Ini latihan sahaja; tidak ditanda.",fav:"☆ Sukar",demo:"MOD DEMO · contoh perkataan, belum disahkan KPM · kemajuan disimpan pada peranti ini sahaja",lang:"English",pt:"Berlatih Bersama",ptx:"Mainkan perkataan. Minta anak ulang dua kali, kemudian sembunyikan terjemahan dan tanya maksudnya.",today:"Cadangan hari ini",mastered:"Dikuasai",pr:"Perkataan latihan"}};
var S={name:"",yr:1,lang:"en",know:"",stars:0,q:{},done:0,hard:{},bad:{}};
try{var x=localStorage.getItem("tb");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
function save(){try{localStorage.setItem("tb",JSON.stringify(S))}catch(e){}}
var $=function(h){document.getElementById("app").innerHTML=h};
function t(k){return T[S.lang][k]}
function speak(c,slow){try{var u=new SpeechSynthesisUtterance(c);u.lang="zh-CN";u.rate=slow?.5:.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function rnd(a){return a.slice().sort(function(){return Math.random()-.5})}
function mean(w){return S.lang=="ms"?w.bm:w.en}
function ph(c){return W.filter(function(w){return w.c==c})[0]}
var BAD=[["First 5 Words","🌱",function(){return S.done>=1}],["Listening Explorer","🏖️",function(){return S.lis>=1}],["Brave Retry","💪",function(){return S.retry>=1}],["Character Master","🏰",function(){return S.trc>=3}],["10 Lessons Completed","🏝️",function(){return S.done>=10}]];
function mascot(m){var mouth=m=="think"?'<ellipse cx="50" cy="66" rx="5" ry="4" fill="#1B2A4A"/>':'<path d="M38 62q12 '+(m=="sad"?'-6':'12')+' 24 0" stroke="#1B2A4A" stroke-width="4" fill="none" stroke-linecap="round"/>';return '<svg width="80" height="80" viewBox="0 0 100 100"><path d="M18 62q0-40 32-40t32 40q0 22-32 22T18 62z" fill="#fff" stroke="#1B2A4A" stroke-width="4"/><path d="M40 24q10-14 20 0" stroke="#1B2A4A" stroke-width="4" fill="#F6A28D"/><circle cx="38" cy="52" r="5" fill="#1B2A4A"/><circle cx="62" cy="52" r="5" fill="#1B2A4A"/><circle cx="30" cy="62" r="5" fill="#F6A28D"/><circle cx="70" cy="62" r="5" fill="#F6A28D"/>'+mouth+'</svg>'}
function demo(){return '<p style="font-size:12px;opacity:.8">'+t("demo")+'</p>'}
function hdr(title){return '<div class="top"><button class="btn soft" onclick="home()">'+t("back")+'</button><b>⭐ '+S.stars+'</b></div><h2>'+title+'</h2>'}

function welcome(){$('<div style="text-align:center">'+mascot("happy")+'<h1>'+t("hello")+'</h1><p>'+t("sub")+'</p></div><div class="card row" style="justify-content:center"><button class="btn" onclick="onb()">'+t("start")+'</button>'+(S.name?'<button class="btn go" onclick="home()">'+t("cont")+'</button>':'')+'<button class="btn alt" onclick="parentView()">'+t("parent")+'</button><button class="btn soft" onclick="S.lang=S.lang==\'en\'?\'ms\':\'en\';save();welcome()">'+t("lang")+'</button></div>'+demo())}
function onb(){$('<div class="card"><h2>'+t("name")+'</h2><input class="t" id="nm" maxlength="20" value="'+S.name+'"><h2>'+t("yr")+'</h2><div class="row">'+[1,2,3].map(function(y){return '<button class="btn '+(S.yr==y?'go':'soft')+'" onclick="S.yr='+y+';onbKeep()">'+y+'</button>'}).join("")+'</div><h2>'+t("know")+'</h2><div class="row">'+["k1","k2","k3"].map(function(k){return '<button class="btn '+(S.know==k?'go':'soft')+'" onclick="S.know=\''+k+'\';onbKeep()">'+t(k)+'</button>'}).join("")+'</div><p><button class="btn" onclick="S.name=document.getElementById(\'nm\').value||\'Friend\';save();home()">'+t("go")+'</button></p></div>')}
function onbKeep(){var v=document.getElementById("nm").value;S.name=v;onb();document.getElementById("nm").value=v}
function home(){var m=Object.keys(S.q).length,p=Math.round(m/W.length*100);var D=[["wf","🌲","var(--mint)","wfd","forest()"],["lb","🏖️","var(--sky)","lbd","setup()"],["cc","🏰","var(--lav)","ccd","castle()"],["mg","🌻","var(--sun)","mgd","garden()"],["ai","🏝️","var(--coral)","aid","island()"]];
$('<div class="row" style="margin-bottom:8px"><button class="btn soft" onclick="welcome()">🏠 '+L("Welcome","Utama")+'</button><button class="btn soft" onclick="onb()">✏️ '+L("Profile","Profil")+'</button><button class="btn soft" onclick="S.lang=S.lang==\'en\'?\'ms\':\'en\';save();home()">'+t("lang")+'</button></div><div class="top"><div class="row">'+mascot("happy")+'<div><h2>'+S.name+'</h2><span class="tag">'+SN()+'</span></div></div><b>⭐ '+S.stars+'</b></div><div class="bar"><i style="width:'+p+'%"></i></div>'+(S.sess?'<button class="btn go" onclick="resume()">▶ '+(S.sess.qs.length-S.sess.i)+'</button>':'')+'<p>'+t("today")+': <b>'+t(m<4?"wf":"lb")+'</b></p><div class="map">'+D.map(function(d){return '<button class="dest" style="background:'+d[2]+'" onclick="'+d[4]+'"><big>'+d[1]+'</big>'+t(d[0])+'<small class="zh">'+{wf:"生字森林",lb:"听写海滩",cc:"汉字城堡",mg:"复习花园",ai:"成就岛"}[d[0]]+'</small><small>'+t(d[3])+'</small></button>'}).join("")+'<button class="dest" style="background:#fff" onclick="parentView()"><big>👪</big>'+t("pt")+'</button></div>'+demo())}

var fi=0,fs=0;
function forest(){fi=fi%W.length;fs=0;fview()}
function fview(){var w=W[fi];var b='<div class="card"><div class="emo pop">'+w.e+'</div>';if(fs==0)b+='<p class="py">'+t("what")+'</p><p class="row" style="justify-content:center"><button class="btn go" onclick="fs=1;speak(W[fi].c);fview()">'+t("reveal")+'</button></p>';else{b+='<p class="big zh">'+w.c+'</p><p class="py">'+w.p+'</p><p style="text-align:center"><b>'+mean(w)+'</b></p><p class="zh" style="text-align:center">'+w.s+'<br><small>'+w.st+'</small></p><div class="row" style="justify-content:center"><button class="btn alt" onclick="speak(W[fi].c)">'+t("listen")+'</button><button class="btn alt" onclick="speak(W[fi].c,1)">'+t("slow")+'</button><button class="btn soft" onclick="S.hard[W[fi].c]=1;S.q[W[fi].c]=S.q[W[fi].c]||{box:0};save();this.textContent=\'★\'">'+t("fav")+'</button><button class="btn" onclick="S.q[W[fi].c]=S.q[W[fi].c]||{box:0};S.done=Math.max(S.done,Math.floor((fi+1)/5));S.stars++;save();fi=(fi+1)%W.length;forest()">'+t("next")+'</button></div>'}$(hdr(t("wf"))+b+'</div>')}

var D={};
function setup(k){if(!k)D={mode:0,n:5};$(hdr(t("lb"))+'<div class="card"><div class="row">'+t("modes").map(function(m,i){return '<button class="btn '+(D.mode==i?'go':'soft')+'" onclick="D.mode='+i+';setup2()">'+m+'</button>'}).join("")+'</div><h2>'+t("n")+'</h2><div class="row">'+[5,10].map(function(n){return '<button class="btn '+(D.n==n?'go':'soft')+'" onclick="D.n='+n+';setup2()">'+n+'</button>'}).join("")+'</div><p><button class="btn" onclick="run()">'+t("begin")+'</button></p></div>')}
function setup2(){setup(1)}
function run(pool){var p=pool||W;D.qs=rnd(p).slice(0,Math.min(D.n||5,p.length));D.i=0;D.ok=0;D.try=0;D.miss=[];D.t0=Date.now();qv()}
function qv(){var w=D.qs[D.i];D.tr=0;var g=D.mode<2;var ch=rnd(W.filter(function(x){return x.c!=w.c}).slice(0,0).concat(rnd(W).filter(function(x){return x.c!=w.c}).slice(0,3)).concat([w]));
$(hdr(t("lb")+" "+(D.i+1)+"/"+D.qs.length)+'<div class="card">'+(D.mode==0?'<div class="emo">'+w.e+'</div><p class="py">'+mean(w)+'</p>':'')+'<p class="row" style="justify-content:center"><button class="btn alt" onclick="speak(D.qs[D.i].c)">'+t("listen")+'</button><button class="btn alt" onclick="speak(D.qs[D.i].c,1)">'+t("slow")+'</button></p><p>'+t("type")+'</p><input class="t zh" id="ans" autocomplete="off"><div id="fb"></div><p><button class="btn go" onclick="chk(document.getElementById(\'ans\').value)">'+t("check")+'</button></p>'+(g?'<p>'+t("or")+'</p><div class="tiles zh">'+ch.map(function(x){return '<button onclick="chk(\''+x.c+'\')">'+x.c+'</button>'}).join("")+'</div>':'')+'</div>');setTimeout(function(){speak(w.c)},300)}
function chk(a){var w=D.qs[D.i],fb=document.getElementById("fb");a=(a||"").normalize("NFC").trim();if(!a)return;
if(a==w.c.normalize("NFC")){var first=D.tr==0;if(first)D.ok++;else D.try++;if(S.q[w.c]&&S.q[w.c].box>=0)S.q[w.c].box=Math.min(4,(S.q[w.c].box||0)+(first?1:0));else S.q[w.c]={box:first?1:0};S.stars++;save();fb.innerHTML='<div class="msg ok pop">'+t("ok")[D.i%3]+'<br><span class="zh">'+w.c+' · '+w.p+' · '+mean(w)+'</span></div><button class="btn" onclick="nx()">'+t("next")+'</button>';speak(w.c)}
else if(D.tr==0){D.tr=1;S.retry=(S.retry||0)+1;fb.innerHTML='<div class="msg try">'+t("almost")+'</div>';speak(w.c,1)}
else{D.miss.push(w.c);S.q[w.c]={box:0};S.hard[w.c]=1;save();fb.innerHTML='<div class="msg try">'+t("answer")+' <span class="zh">'+w.c+' · '+w.p+' · '+mean(w)+'</span></div><button class="btn" onclick="nx()">'+t("next")+'</button>';speak(w.c)}}
function nx(){D.i++;if(D.i>=D.qs.length)res();else qv()}
function res(){S.lis=(S.lis||0)+1;S.done++;S.stars+=3;save();var n=D.qs.length,s=Math.round((Date.now()-D.t0)/1000);$(hdr(t("fin"))+'<div class="card" style="text-align:center">'+mascot("happy")+'<p class="py">'+D.ok+' / '+n+'</p><p>⏱ '+s+'s · 🔁 '+D.try+'</p>'+(D.miss.length?'<p>'+t("revise")+':</p><p class="big zh" style="font-size:48px">'+D.miss.join(" ")+'</p>':'<p>⭐⭐⭐</p>')+'<button class="btn" onclick="home()">'+t("back")+'</button></div>')}

var cc="水";
function castle(){$(hdr(t("cc"))+'<div class="card"><div class="row" style="justify-content:center">'+W.map(function(w){return '<button class="btn '+(w.c==cc?'go':'soft')+' zh" onclick="cc=\''+w.c+'\';castle()">'+w.c+'</button>'}).join("")+'</div><canvas id="cv" width="340" height="340"></canvas><p class="row" style="justify-content:center"><button class="btn alt" onclick="speak(cc)">'+t("listen")+'</button><button class="btn soft" onclick="drawG()">'+t("clear")+'</button></p><p style="font-size:14px">'+t("trace")+'</p></div>');drawG();var c=document.getElementById("cv"),x=c.getContext("2d"),d=0,once=0;function pt(e){var r=c.getBoundingClientRect();return[(e.clientX-r.left)*340/r.width,(e.clientY-r.top)*340/r.height]}
c.onpointerdown=function(e){d=1;var p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);c.setPointerCapture(e.pointerId)};c.onpointermove=function(e){if(!d)return;var p=pt(e);x.strokeStyle="#1B2A4A";x.lineWidth=9;x.lineCap="round";x.lineTo(p[0],p[1]);x.stroke()};c.onpointerup=function(){d=0;if(!once){once=1;S.trc=(S.trc||0)+1;save()}}}
function drawG(){var c=document.getElementById("cv"),x=c.getContext("2d");x.clearRect(0,0,340,340);x.strokeStyle="#F6A28D";x.lineWidth=2;x.setLineDash([8,6]);x.strokeRect(2,2,336,336);x.beginPath();x.moveTo(170,0);x.lineTo(170,340);x.moveTo(0,170);x.lineTo(340,170);x.moveTo(0,0);x.lineTo(340,340);x.moveTo(340,0);x.lineTo(0,340);x.stroke();x.setLineDash([]);x.font='260px "Noto Sans SC","PingFang SC",sans-serif';x.fillStyle="#d9d9d9";x.textAlign="center";x.textBaseline="middle";x.fillText(cc,170,180)}

function garden(){var ks=Object.keys(S.q),hard=ks.filter(function(c){return S.q[c].box<3}),m=ks.filter(function(c){return S.q[c].box>=3});
$(hdr(t("mg"))+'<div class="card"><h2>'+t("revise")+'</h2>'+(hard.length?'<p class="big zh" style="font-size:44px">'+hard.join(" ")+'</p><button class="btn" onclick="D={mode:0,n:10};run(hard.map(ph))">'+t("pr")+'</button>':'<p>'+t("none")+'</p>')+'</div><div class="card"><h2>'+t("mastered")+' 🌟</h2><p class="zh" style="font-size:36px">'+(m.join(" ")||"–")+'</p></div>')}
function island(){$(hdr(t("ai"))+'<div class="card"><p class="py">⭐ '+S.stars+'</p><div class="map">'+BAD.map(function(b){var on=b[2]();return '<div class="bd '+(on?'pop':'off')+'">'+b[1]+'<br><small>'+b[0]+'</small></div>'}).join("")+'</div></div>')}
function parentView(){var ks=Object.keys(S.q);$('<div class="top"><button class="btn soft" onclick="welcome()">'+t("back")+'</button></div><h2>'+t("parent")+'</h2><div class="card"><p><b>'+(S.name||"–")+'</b> · Std '+S.yr+'</p><p>⭐ '+S.stars+' · Sessions: '+(S.lis||0)+' · '+t("mastered")+': '+ks.filter(function(c){return S.q[c].box>=3}).length+'</p><p>'+t("revise")+': <span class="zh">'+(ks.filter(function(c){return S.q[c].box<3}).join(" ")||"–")+'</span></p></div><div class="card"><h2>'+t("pt")+'</h2><p>'+t("ptx")+'</p><button class="btn alt" onclick="speak(W[Math.floor(Math.random()*W.length)].c)">'+t("listen")+'</button></div><p style="font-size:13px">Demo only: no login or cloud sync yet. Data stays on this device.</p>')}
var L=function(e,m){return S.lang=="ms"?m:e};
var STG=[["🧸","小小探索家","Little Explorers","3–4"],["⭐","中文小达人","Little Mandarin Stars","5–6"],["1️⃣","一年级","Standard 1","7"],["2️⃣","二年级","Standard 2","8"],["3️⃣","三年级","Standard 3","9"]];

function startM(m){S.mp=S.mp||{};var p=Q.filter(function(q){return q.m==m&&q.y<=S.yr});p.forEach(function(q){var h=S.mp[q.id];q.r=Math.random()+(h&&h.r==1?.7:0)-(h&&h.r==0?.6:0)+(q.y<S.yr?.2:0)});p.sort(function(a,b){return a.r-b.r});var qs=p.slice(0,10);for(var i=1;i<qs.length;i++)if(qs[i].f==qs[i-1].f)for(var j=i+1;j<qs.length;j++)if(qs[j].f!=qs[i-1].f){var x=qs[i];qs[i]=qs[j];qs[j]=x;break}M={m:m,qs:qs,i:0,ok:0};qm()}
function qm(){var q=M.qs[M.i],N=M.qs.length,d=MN[q.m];M.tr=0;M.done=0;M.b=[];M.u=[];M.p=q.tk?rnd(q.tk):[];M.o=q.o?(q.o[0]=="True"?q.o:rnd(q.o)):[];var b='<span class="tag">L'+q.lv+' '+LVN[q.lv-1]+'</span> <span class="tag">'+q.f+'</span>';
if(q.t)b+='<p class="zh" style="font-size:30px;text-align:center">'+q.t+'</p><p class="row" style="justify-content:center"><button class="btn alt" onclick="speak(M.qs[M.i].t)">🔊</button><button class="btn soft" onclick="document.getElementById(\'gl\').style.display=\'block\'">'+L("Show meaning","Tunjuk maksud")+'</button></p><p id="gl" style="display:none;text-align:center">'+q.g+'</p>';
if(q.e)b+='<div class="emo">'+q.e+'</div>';if(q.au)b+='<p style="text-align:center"><button class="btn alt" onclick="speak(M.qs[M.i].au)">🔊 '+t("listen")+'</button></p>';
b+='<p class="zh" style="font-size:22px">'+(q.p||"")+'</p>';
if(q.k=="c")b+='<div class="tiles zh" style="grid-template-columns:repeat(2,1fr)">'+M.o.map(function(x,i){return '<button style="font-size:22px" onclick="rchk(M.o['+i+'])">'+x+'</button>'}).join("")+'</div>';
if(q.k=="o")b+='<div class="bd zh" id="bd" style="font-size:26px"></div><div class="row zh" id="tk" style="margin:10px 0"></div><div class="row"><button class="btn soft" onclick="M.u.pop();M.b.pop();ro()">↩</button><button class="btn go" onclick="rchk(M.b.join(\'\'))">'+t("check")+'</button></div>';
if(q.k=="t")b+='<input class="t zh" id="ans" autocomplete="off"><p><button class="btn go" onclick="rchk(document.getElementById(\'ans\').value)">'+t("check")+'</button></p>';
if(q.k=="w")b+='<p class="zh" style="font-size:22px">'+L("Word bank","Bank perkataan")+': '+q.wb.join(" · ")+'</p><p class="zh">'+L("Starter","Permulaan")+': <b>'+q.st+'</b></p><textarea id="wr" class="t zh" rows="3" style="font-size:22px"></textarea><p><button class="btn go" onclick="doneW()">'+L("I’m done","Siap")+'</button></p>';
if(q.k=="r")b+='<canvas id="cv" width="340" height="340"></canvas><p class="row" style="justify-content:center"><button class="btn alt" onclick="speak(M.qs[M.i].c)">🔊</button><button class="btn soft" onclick="drawG()">'+t("clear")+'</button><button class="btn go" onclick="doneW(1)">'+t("next")+'</button></p><small>'+t("trace")+'</small>';
$(hdr(d[0]+" "+(M.i+1)+"/"+N)+'<div class="bar"><i style="width:'+Math.round(M.i/N*100)+'%"></i></div><div class="card">'+b+'<div id="fb"></div></div>');
if(q.k=="o")ro();if(q.k=="r"){cc=q.c;drawG();var c=document.getElementById("cv"),x=c.getContext("2d"),dn=0;c.onpointerdown=function(e){dn=1;var r=c.getBoundingClientRect();x.beginPath();x.moveTo((e.clientX-r.left)*340/r.width,(e.clientY-r.top)*340/r.height);c.setPointerCapture(e.pointerId)};c.onpointermove=function(e){if(!dn)return;var r=c.getBoundingClientRect();x.strokeStyle="#1B2A4A";x.lineWidth=9;x.lineCap="round";x.lineTo((e.clientX-r.left)*340/r.width,(e.clientY-r.top)*340/r.height);x.stroke()};c.onpointerup=function(){dn=0}}if(q.au)setTimeout(function(){speak(q.au)},300)}
function ro(){document.getElementById("bd").innerHTML=M.b.join("")||"…";document.getElementById("tk").innerHTML=M.p.map(function(x,i){return M.u.indexOf(i)<0?'<button class="btn soft zh" onclick="pk('+i+')">'+x+'</button>':""}).join("")}
function pk(i){M.u.push(i);M.b.push(M.p[i]);ro()}
function doneW(tr){var q=M.qs[M.i],fb=document.getElementById("fb");if(M.done)return;M.done=1;S.mp=S.mp||{};S.mp[q.id]={r:1};if(tr){S.trc=(S.trc||0)+1}else{S.comp=(S.comp||0)+1;S.writes=(S.writes||[]).concat([{id:q.id,w:document.getElementById("wr").value}]).slice(-20)}S.stars++;save();fb.innerHTML='<div class="msg ok pop">'+t("ok")[M.i%3]+(tr?'<br><small>'+L("Practice only, not marked.","Latihan sahaja, tidak ditanda.")+'</small>':'<br><small>'+L("Check: right words? sentence makes sense? in order? (ask a grown-up or teacher). Not auto-marked.","Semak: perkataan betul? ayat bermakna? tertib? (tanya dewasa/guru). Tidak ditanda automatik.")+'</small>')+'</div><button class="btn" onclick="nm()">'+t("next")+'</button>'}
function rchk(a){if(M.done)return;var q=M.qs[M.i],fb=document.getElementById("fb"),z=function(s){return(s||"").normalize("NFC").replace(/\s/g,"").toLowerCase()};a=z(a);if(!a)return;var s=S.ms=S.ms||{},r=s[q.m]=s[q.m]||{ok:0,n:0};S.mp=S.mp||{};var nb='<button class="btn" onclick="nm()">'+t("next")+'</button>',ex=q.x?'<br><small>'+q.x+'</small>':"";if(a==z(q.a)){M.done=1;r.n++;if(M.tr==0){r.ok++;M.ok++;S.mp[q.id]={r:1}}else S.mp[q.id]={r:0};S.stars++;fb.innerHTML='<div class="msg ok pop">'+t("ok")[M.i%3]+ex+'</div>'+nb}else if(M.tr==0){M.tr=1;S.retry=(S.retry||0)+1;if(q.k=="o"){M.u=[];M.b=[];ro()}fb.innerHTML='<div class="msg try">'+t("almost")+'</div>'}else{M.done=1;r.n++;S.mp[q.id]={r:0};fb.innerHTML='<div class="msg try">'+t("answer")+': <span class="zh">'+q.a+'</span>'+ex+'</div>'+nb}save()}
function nm(){M.i++;if(M.i>=M.qs.length){S.stars+=3;S.done++;save();$(hdr(t("fin"))+'<div class="card" style="text-align:center">'+mascot("happy")+'<p class="py">'+M.ok+' / '+M.qs.length+'</p><button class="btn" onclick="mod('+M.m+')">OK</button></div>')}else qm()}
function report(){var s=S.ms||{},rows="",best=null,low=null;for(var m=1;m<=6;m++){var d=MN[m],r=s[m]||{ok:0,n:0},p=r.n?Math.round(r.ok/r.n*100):null;if(m==6){rows+='<p>'+d[0]+' '+L(d[1],d[3])+': '+(S.comp||0)+' '+L("pieces written (rubric: words, sentences, meaning, order; not auto-marked)","karangan ditulis (rubrik; tidak ditanda automatik)")+'</p>';continue}rows+='<p>'+d[0]+' '+L(d[1],d[3])+': '+(p===null?"–":p+'% ('+r.ok+'/'+r.n+')')+'</p>'+(p===null?'':'<div class="bar"><i style="width:'+p+'%"></i></div>');if(p!==null){if(!best||p>best[1])best=[m,p];if(!low||p<low[1])low=[m,p]}}return '<div class="card"><h2>'+L("Skills profile","Profil kemahiran")+'</h2>'+rows+(best?'<p>💪 '+L("Strength","Kekuatan")+': '+L(MN[best[0]][1],MN[best[0]][3])+'</p><p>🎯 '+L("Practise next","Latih seterusnya")+': '+L(MN[low[0]][1],MN[low[0]][3])+'</p>':'<p>'+L("Play a module to see strengths.","Main satu modul untuk lihat kekuatan.")+'</p>')+'</div>'}
var _pv=parentView;parentView=function(){_pv();document.getElementById("app").insertAdjacentHTML("beforeend",report())};
welcome();
</script></body></html>
